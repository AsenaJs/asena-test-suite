[install]
saveTextLockfile = true

[fmt]
printWidth = 120
singleQuote = true
tabWidth = 2
useTabs = false
endOfLine = "lf"
ignorePatterns = [
  "bun.lock",
  "*.md",
  "**/fixtures/**/*.html",
  "**/fixtures/**/*.css",
  "**/fixtures/**/*.json",
  "**/fixtures/**/*.txt",
  "tools/validate/fixtures",
]
